[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "book-audio-production"
version = "0.1.0"
description = "Local deterministic batch audio preparation with verifiable QA"
requires-python = ">=3.12"
dependencies = ["psutil>=6,<8"]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "jsonschema>=4,<5", "ruff>=0.6,<1", "mypy>=1.11,<3", "types-psutil", "types-jsonschema", "pytest-cov>=5,<8"]

[project.scripts]
book-audio = "book_audio_production.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_audio_production = ["toolchain.lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Correctness (F, B), style errors (E), import order (I) and modern syntax
# (UP). Widen the selection one rule family at a time, fixing findings as it
# lands, rather than adding per-file ignores.
select = ["E", "F", "I", "B", "UP", "SIM", "PT", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true

[tool.coverage.run]
source = ["book_audio_production"]
branch = true
